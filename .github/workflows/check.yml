name: check

env:
  MIN_COVERAGE_PERCENT: 100

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "30 0 * * 1" # Every Monday at half past midnight UTC

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: ubuntu-latest
          - name: macos-latest
          - name: windows-latest

    runs-on: ${{ matrix.os.name }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: install MoonBit
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -ExecutionPolicy Bypass -Command '$env:MOONBIT_INSTALL_VERSION="nightly"; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex'
            echo "$USERPROFILE/.moon/bin" >> "$GITHUB_PATH"
          else
            curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s nightly
            echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          fi

      - name: moon version
        run: |
          moon version --all
          moonrun --version

      - name: moon check
        run: |
          moon update
          moon check --target all --deny-warn

      - name: moon info and moon fmt
        shell: bash
        run: |
          moon info
          moon fmt
          git diff --exit-code
          untracked_mbti="$(git ls-files --others --exclude-standard -- pkg.generated.mbti ':(glob)**/pkg.generated.mbti')"
          if [ -n "$untracked_mbti" ]; then
            echo "moon info generated untracked interface files:"
            printf '%s\n' "$untracked_mbti"
            exit 1
          fi

      - name: moon test
        env:
          OCAMLRUNPARAM: b
        run: |
          moon test --target wasm
          moon test --target wasm --release
          moon test --target wasm-gc
          moon test --target wasm-gc --release
          moon test --target js
          moon test --target js --release
          moon test --target native
          moon test --target native --release

      - name: coverage gate
        if: ${{ matrix.os.name == 'ubuntu-latest' }}
        shell: bash
        run: |
          coverage_file="$RUNNER_TEMP/flate-coverage.txt"
          moon coverage clean
          moon test --target native --enable-coverage --no-parallelize \
            --warn-list +73 --deny-warn
          # Merge the scalar fallback selected by JS with the SIMD path
          # selected by native; both are mutually exclusive source variants.
          moon test --target js --enable-coverage --no-parallelize \
            --warn-list +73 --deny-warn
          moon coverage report -- -f summary | tee "$coverage_file"
          awk -v minimum="$MIN_COVERAGE_PERCENT" '
            /^Total:/ {
              split($2, counts, "/")
              found = 1
              if (100 * counts[1] / counts[2] < minimum) exit 1
            }
            END { if (!found) exit 1 }
          ' "$coverage_file"
